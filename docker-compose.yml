services:
  db:
    image: mysql:8.0
    container_name: db-${WP_ENV}
    restart: always
    env_file: .env
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - college-network
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0-php8.2-apache
    container_name: wp-${WP_ENV}
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - "${WP_PORT}:80"
    networks:
      - college-network
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma-${WP_ENV}
    restart: always
    env_file: .env
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    networks:
      - college-network
    ports:
      - "${PMA_PORT}:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-live
    restart: always
    env_file: .env.live
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - college-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin


volumes:
  wordpress_core:
  db_data:
  pgadmin_data:

networks:
  college-network:
    external: true