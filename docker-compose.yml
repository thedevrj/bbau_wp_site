version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: db-${WP_ENV}
    restart: always
    env_file: .env
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - college-network
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.5-php8.2-apache
    container_name: wp-${WP_ENV}
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - "${WP_PORT}:80"
    networks:
      - college-network
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DEBUG: 1

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma-${WP_ENV}
    restart: always
    env_file: .env
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    networks:
      - college-network
    ports:
      - "${PMA_PORT}:80"

volumes:
  db_data:

networks:
  college-network:
    external: true